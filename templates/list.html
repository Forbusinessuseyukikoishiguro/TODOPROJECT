{% extends 'base.html' %}

{% block header %}
<div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1 class="display-4">TodoList</h1>
      <p class="lead">Todolistを作成して生産的な毎日を過ごしましょう</p>
    </div>
</div>
{% endblock header %}

{% block content %}
<div class="container">
    <a href="{% url 'create' %}" class="btn btn-info mb-2" role="button">新規作成画面</a>
{% for item in object_list %}
    <div class="alert alert-{{ item.priority }}" role="alert">
        <p>{{item.title}} 期日{{ item.duedate}}</p> 
        
        
        <a href="{% url 'update' item.pk %}" class="btn btn-primary" role="button">編集画面へ</a>
        <a href="{% url 'delete' item.pk %}" class="btn btn-danger" role="button">削除画面へ</a>
        <a href="{% url 'detail' item.pk %}" class="btn btn-info" role="button">詳細画面へ</a>
    </div>
{% endfor %}
</div>
{% endblock content %}
